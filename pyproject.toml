[project]
name = "openbexi-timeline"
version = "2.0.0"
description = "Single-writer JSON timeline service"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2,<3",
  "uvicorn>=0.30,<1",
  "portalocker>=3,<4",
  "fonttools[woff]>=4,<5",
  "jsonschema>=4,<5",
  "jsonschema-rs==0.34.0; python_version < '3.10'",
  "jsonschema-rs==0.56.0; python_version >= '3.10'",
  "jsonpatch==1.33",
  "rfc8785>=0.1,<1",
  "tzdata>=2025.2,<2027",
  "PyYAML>=6,<7",
  "google-re2==1.1.20250805; python_version < '3.10'",
  "google-re2==1.1.20251105; python_version >= '3.10'",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests/server"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
