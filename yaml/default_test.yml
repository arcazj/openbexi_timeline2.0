version: 2
server:
  host: 127.0.0.1
  port: 8771
  local_browser: true
  state_root: ../var/default-test
model: ../models/legacy_test.json
filter: ../filters/legacy_test.json
loading:
  buffer_ratio: 0
data_sources:
  - id: source1
    namespace: SOURCE1
    type: json_file
    enable: true
    data_path: ../../openbexi_timeline/tests/data/SOURCES1
    data_model: yyyy/mm/dd
    identity_path: tests/data/SOURCES1/yyyy/mm/dd
    timezone: UTC
    dialect: legacy-json
    render: {color: '#404040', textColor: '#ffffff', dateColor: '#ffffff', alternateColor: '#e6e6e6'}
  - id: source2
    namespace: SOURCE2
    type: json_file
    enable: true
    data_path: ../../openbexi_timeline/tests/data/SOURCES2
    data_model: yyyy/mm/dd
    identity_path: tests/data/SOURCES2/yyyy/mm/dd
    timezone: UTC
    dialect: legacy-json
    render: {color: '#D3D3D3', textColor: '#000000', dateColor: '#000000', alternateColor: '#e6e6e6'}
